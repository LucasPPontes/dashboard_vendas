<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.5" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    
    <filter id="subtleShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; fill: #F8FAFC; }
    .subtitle-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; fill: #94A3B8; }
    .card-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #94A3B8; letter-spacing: 0.8px; text-transform: uppercase; }
    .section-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 15px; fill: #E2E8F0; letter-spacing: 0.5px; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 11px; fill: #38BDF8; }
  </style>

  <rect width="1920" height="1080" fill="url(#bgGradient)" />
  
  <g stroke="#334155" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 120 H1920 M0 240 H1920 M0 360 H1920 M0 480 H1920 M0 600 H1920 M0 720 H1920 M0 840 H1920 M0 960 H1920" />
    <path d="M240 0 V1080 M480 0 V1080 M720 0 V1080 M960 0 V1080 M1200 0 V1080 M1440 0 V1080 M1680 0 V1080" />
  </g>

  <g filter="url(#shadow)">
    <rect x="25" y="20" width="1870" height="75" rx="14" fill="url(#headerGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
    
    <rect x="40" y="37" width="5" height="40" rx="2.5" fill="url(#blueGlow)" />
    
    <g transform="translate(60, 36)">
      <rect width="42" height="42" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <path d="M12 28 L18 18 L24 23 L30 14" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="30" cy="14" r="3" fill="#38BDF8" />
    </g>

    <text x="118" y="54" class="title-text" font-size="20">DASHBOARD EXECUTIVO DE VENDAS</text>
    <text x="118" y="72" class="subtitle-text" font-size="12">Análise Estratégica Comercial &amp; Performance de Mercado</text>

    <g transform="translate(1710, 42)">
      <rect width="160" height="30" rx="15" fill="#0F172A" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="18" cy="15" r="4" fill="#10B981" />
      <text x="30" y="19" class="badge-text">POWER BI INTERFACE</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="25" y="110" width="270" height="945" rx="14" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
    
    <path d="M25 110 H295 V160 H25 Z" fill="#1E293B" fill-opacity="0.6" />
    <text x="45" y="141" class="section-title">FILTROS &amp; NAVEGAÇÃO</text>
    <rect x="45" y="160" width="230" height="2" fill="url(#blueGlow)" opacity="0.8" />

    <g transform="translate(45, 185)">
      <text x="0" y="0" class="card-title">Período / Ano</text>
    </g>

    <g transform="translate(45, 305)">
      <text x="0" y="0" class="card-title">Categoria de Produto</text>
    </g>

    <g transform="translate(45, 455)">
      <text x="0" y="0" class="card-title">Região / Estado</text>
    </g>

    <g transform="translate(45, 605)">
      <text x="0" y="0" class="card-title">Canal de Venda</text>
    </g>

    <g transform="translate(45, 875)">
      <rect width="230" height="160" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="15" y="30" class="card-title" fill="#38BDF8">RESUMO DO MODELO</text>
      <text x="15" y="60" class="subtitle-text" font-size="11">Tabela Fato: fato_vendas</text>
      <text x="15" y="80" class="subtitle-text" font-size="11">Dimensões: 4 Tabelas</text>
      <text x="15" y="100" class="subtitle-text" font-size="11">Relacionamento: 1 : N</text>
      <rect x="15" y="120" width="200" height="25" rx="5" fill="#1E293B" />
      <text x="115" y="137" text-anchor="middle" class="badge-text" fill="#10B981">STAR SCHEMA ATIVO</text>
    </g>
  </g>

  <g filter="url(#subtleShadow)">
    <rect x="315" y="110" width="375" height="130" rx="14" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
    <rect x="315" y="110" width="375" height="5" rx="2.5" fill="url(#blueGlow)" />
    <circle cx="355" cy="175" r="22" fill="#1E3A8A" fill-opacity="0.5" />
    <path d="M347 180 L353 170 L358 175 L365 165" stroke="#60A5FA" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="390" y="179" class="card-title">FATURAMENTO TOTAL</text>
  </g>

  <g filter="url(#subtleShadow)">
    <rect x="710" y="110" width="375" height="130" rx="14" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
    <rect x="710" y="110" width="375" height="5" rx="2.5" fill="url(#emeraldGlow)" />
    <circle cx="750" cy="175" r="22" fill="#064E3B" fill-opacity="0.5" />
    <path d="M744 180 V167 H756 V180 M744 173 H756" stroke="#34D399" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="785" y="179" class="card-title">LUCRO LIQUIDO TOTAL</text>
  </g>

  <g filter="url(#subtleShadow)">
    <rect x="1105" y="110" width="375" height="130" rx="14" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
    <rect x="1105" y="110" width="375" height="5" rx="2.5" fill="url(#purpleGlow)" />
    <circle cx="1145" cy="175" r="22" fill="#4C1D95" fill-opacity="0.5" />
    <text x="1145" y="181" text-anchor="middle" font-family="Segoe UI" font-weight="bold" font-size="18" fill="#A78BFA">%</text>
    <text x="1180" y="179" class="card-title">MARGEM DE LUCRO MÉDIA</text>
  </g>

  <g filter="url(#subtleShadow)">
    <rect x="1500" y="110" width="395" height="130" rx="14" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
    <rect x="1500" y="110" width="395" height="5" rx="2.5" fill="url(#amberGlow)" />
    <circle cx="1540" cy="175" r="22" fill="#78350F" fill-opacity="0.5" />
    <path d="M1532 168 H1548 L1545 181 H1535 Z" stroke="#FBBF24" stroke-width="2" fill="none" />
    <text x="1575" y="179" class="card-title">TICKET MÉDIO &amp; QTD PEDIDOS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="315" y="260" width="1165" height="420" rx="14" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
    <text x="340" y="295" class="section-title">EVOLUÇÃO TEMPORAL DE FATURAMENTO E LUCRO</text>
    <text x="340" y="315" class="subtitle-text" font-size="12">Visão mensal consolidada por ano e trimestre</text>
    <line x1="340" y1="330" x2="1455" y2="330" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />
  </g>

  <g filter="url(#shadow)">
    <rect x="1500" y="260" width="395" height="420" rx="14" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
    <text x="1520" y="295" class="section-title">VENDAS POR CANAL</text>
    <text x="1520" y="315" class="subtitle-text" font-size="12">Participação % dos canais</text>
    <line x1="1520" y1="330" x2="1875" y2="330" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />
  </g>

  <g filter="url(#shadow)">
    <rect x="315" y="700" width="765" height="355" rx="14" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
    <text x="340" y="735" class="section-title">TOP PRODUTOS &amp; DESEMPENHO POR CATEGORIA</text>
    <text x="340" y="755" class="subtitle-text" font-size="12">Ranking de receita por item</text>
    <line x1="340" y1="770" x2="1055" y2="770" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />
  </g>

  <g filter="url(#shadow)">
    <rect x="1105" y="700" width="790" height="355" rx="14" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
    <text x="1130" y="735" class="section-title">PERFORMANCE REGIONAL &amp; META DOS VENDEDORES</text>
    <text x="1130" y="755" class="subtitle-text" font-size="12">Comparativo por equipe e região</text>
    <line x1="1130" y1="770" x2="1875" y2="770" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />
  </g>

</svg>
